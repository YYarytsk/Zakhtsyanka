name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dummy public vars so Next.js build doesn't fail in CI (no real secrets)
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_PUBLIC_STORE_NAME_UK: Захцянка
  NEXT_PUBLIC_STORE_NAME_EN: Zakhtsyanka
  NEXT_PUBLIC_DEFAULT_LOCALE: uk

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (shared)
        run: pnpm --filter @zakhtsyanka/shared typecheck

      - name: Typecheck (web)
        run: pnpm --filter @zakhtsyanka/web typecheck

      - name: Lint (web)
        run: pnpm --filter @zakhtsyanka/web lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @zakhtsyanka/web build

  # ── Azure Container Registry push (main branch only) ──────────────────────
  push-image:
    name: Push to ACR
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write   # for OIDC login to Azure

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/zakhtsyanka-web:${{ github.sha }}
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg NEXT_PUBLIC_STORE_NAME_UK=${{ secrets.NEXT_PUBLIC_STORE_NAME_UK }} \
            --build-arg NEXT_PUBLIC_STORE_NAME_EN=${{ secrets.NEXT_PUBLIC_STORE_NAME_EN }} \
            --build-arg NEXT_PUBLIC_WFP_MERCHANT_ACCOUNT=${{ secrets.NEXT_PUBLIC_WFP_MERCHANT_ACCOUNT }} \
            --build-arg NEXT_PUBLIC_WFP_MERCHANT_DOMAIN=${{ secrets.NEXT_PUBLIC_WFP_MERCHANT_DOMAIN }} \
            -f apps/web/Dockerfile \
            -t $IMAGE .
          docker push $IMAGE
          # Also tag as latest
          docker tag $IMAGE ${{ secrets.ACR_NAME }}.azurecr.io/zakhtsyanka-web:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/zakhtsyanka-web:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name zakhtsyanka-web \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/zakhtsyanka-web:${{ github.sha }}
